
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe !!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>My Game World</h1>
        <p>Welcome to my little world of game!</p>
    </header>

    <main>


        <section id="tic-tac-toe">
            <img
        src="{{ url_for('static', filename='images/Tic-Tac.png') }}"
        alt="Tic-Tac-Toe game"
                >

            <div id="tic-tac-toe-intro">
                <h2>Tic-Tac-Toe</h2>
                <p>Challenge the computer in a Tic-Tac-Toe!</p>
                <button id="play-tic-tac-toe">Play</button>
            </div>
            <div id="tic-tac-toe-game" hidden>
                <p id="game-message">Your turn! Choose a square.</p>
                <div id="tic-tac-toe-board">
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                    <button class="cell"></button>
                </div>
                <button id="restart-tic-tac-toe">New Game</button>
            </div>
        </section>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
